<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UFO Tracker 🛸 | Live Sightings Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
        }
        header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0f0;
        }
        h1 { 
            font-size: 2em;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 5px;
        }
        .tagline {
            color: #0a0;
            font-size: 0.9em;
            margin-bottom: 15px;
        }
        .update-btn {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
        }
        .update-btn:hover {
            background: #0c0;
        }
        .update-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #map { 
            height: 600px;
            width: 100%;
            border: 2px solid #0f0;
        }
        .info-panel {
            background: #111;
            padding: 20px;
            border-top: 2px solid #0f0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
            padding: 10px;
        }
        .stat-number {
            font-size: 2em;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        .stat-label {
            color: #0a0;
            font-size: 0.8em;
        }
        .controls {
            text-align: center;
            padding: 15px;
            background: #0a0a0a;
        }
        select {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
            font-family: 'Courier New', monospace;
            margin: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #0a0;
            font-size: 0.8em;
        }
        .leaflet-popup-content-wrapper {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
        }
        .leaflet-popup-tip {
            background: #111;
        }
        .status-message {
            text-align: center;
            padding: 10px;
            color: #0a0;
            font-size: 0.9em;
        }
        @media (max-width: 768px) {
            h1 { font-size: 1.5em; }
            #map { height: 400px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>UFO TRACKER 🛸</h1>
        <p class="tagline">Live Map of Recent Sightings from NUFORC</p>
        <button class="update-btn" id="updateBtn" onclick="fetchNUFORCData()">
            UPDATE SIGHTINGS
        </button>
        <div class="status-message" id="statusMsg">Click UPDATE to load latest sightings</div>
    </header>

    <div class="controls">
        <label>Time Range:</label>
        <select id="timeFilter" onchange="filterMarkers()">
            <option value="7">Last 7 Days</option>
            <option value="30" selected>Last 30 Days</option>
            <option value="90">Last 90 Days</option>
            <option value="365">Last Year</option>
        </select>
    </div>

    <div id="map"></div>

    <div class="info-panel">
        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalReports">-</div>
                <div class="stat-label">TOTAL REPORTS</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="lastUpdate">-</div>
                <div class="stat-label">LAST UPDATED</div>
            </div>
            <div class="stat">
                <div class="stat-number">NUFORC</div>
                <div class="stat-label">DATA SOURCE</div>
            </div>
        </div>
    </div>

    <footer>
        <p>Data from National UFO Reporting Center (NUFORC)</p>
        <p>Click UPDATE SIGHTINGS to load latest reports</p>
        <p style="margin-top: 10px;">🔱 Built by TridentIntelFree</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
