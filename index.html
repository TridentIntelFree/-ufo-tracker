<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UFO Tracker 🛸 | Live Sightings Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
        }
        header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0f0;
        }
        h1 { 
            font-size: 2em;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 5px;
        }
        .tagline {
            color: #0a0;
            font-size: 0.9em;
        }
        #map { 
            height: 600px;
            width: 100%;
            border: 2px solid #0f0;
        }
        .info-panel {
            background: #111;
            padding: 20px;
            border-top: 2px solid #0f0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
            padding: 10px;
        }
        .stat-number {
            font-size: 2em;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }
        .stat-label {
            color: #0a0;
            font-size: 0.8em;
        }
        .controls {
            text-align: center;
            padding: 15px;
            background: #0a0a0a;
        }
        select {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px;
            font-family: 'Courier New', monospace;
            margin: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #0a0;
            font-size: 0.8em;
        }
        .leaflet-popup-content-wrapper {
            background: #111;
            color: #0f0;
            border: 1px solid #0f0;
        }
        .leaflet-popup-tip {
            background: #111;
        }
    </style>
</head>
<body>
    <header>
        <h1>UFO TRACKER 🛸</h1>
        <p class="tagline">Live Map of Recent Sightings | Auto-Updated Daily</p>
    </header>

    <div class="controls">
        <label>Time Range:</label>
        <select id="timeFilter">
            <option value="7">Last 7 Days</option>
            <option value="30" selected>Last 30 Days</option>
            <option value="90">Last 90 Days</option>
            <option value="365">Last Year</option>
        </select>
    </div>

    <div id="map"></div>

    <div class="info-panel">
        <div class="stats">
            <div class="stat">
                <div class="stat-number" id="totalReports">-</div>
                <div class="stat-label">TOTAL REPORTS</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="lastUpdate">-</div>
                <div class="stat-label">LAST UPDATED</div>
            </div>
            <div class="stat">
                <div class="stat-number" id="dataSource">NUFORC</div>
                <div class="stat-label">DATA SOURCE</div>
            </div>
        </div>
    </div>

    <footer>
        <p>Data from National UFO Reporting Center (NUFORC)</p>
        <p>Updates automatically every 24 hours</p>
        <p style="margin-top: 10px;">🔱 Built by TridentIntelFree</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([39.8283, -98.5795], 4); // Center on USA

        // Add dark tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        let markers = [];

        // Load UFO data
        async function loadUFOData() {
            try {
                const response = await fetch('ufo-data.json');
                const data = await response.json();
                
                document.getElementById('totalReports').textContent = data.reports.length;
                document.getElementById('lastUpdate').textContent = new Date(data.updated).toLocaleDateString();
                
                displayReports(data.reports);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('totalReports').textContent = 'ERROR';
            }
        }

        function displayReports(reports) {
            // Clear existing markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const timeFilter = parseInt(document.getElementById('timeFilter').value);
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - timeFilter);

            reports.forEach(report => {
                const reportDate = new Date(report.date);
                if (reportDate < cutoffDate) return;

                if (report.lat && report.lng) {
                    const marker = L.circleMarker([report.lat, report.lng], {
                        radius: 6,
                        fillColor: '#0f0',
                        color: '#0f0',
                        weight: 1,
                        opacity: 0.8,
                        fillOpacity: 0.6
                    }).addTo(map);

                    marker.bindPopup(`
                        <strong>${report.city}, ${report.state}</strong><br>
                        Date: ${report.date}<br>
                        Shape: ${report.shape || 'Unknown'}<br>
                        Duration: ${report.duration || 'Unknown'}<br>
                        <em>${report.summary ? report.summary.substring(0, 100) + '...' : 'No description'}</em>
                    `);

                    markers.push(marker);
                }
            });
        }

        // Filter change
        document.getElementById('timeFilter').addEventListener('change', () => {
            loadUFOData();
        });

        // Load data on page load
        loadUFOData();
    </script>
</body>
</html>
