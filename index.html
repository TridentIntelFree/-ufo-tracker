​​​​​​​​​​​​<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UFO Tracker 🛸</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
        }
        header {
            background: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0f0;
        }
        h1 { 
            font-size: 2em;
            text-shadow: 0 0 10px #0f0;
            margin-bottom: 10px;
        }
        .update-btn {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            margin: 10px 0;
        }
        .update-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #map { 
            height: 500px;
            width: 100%;
            margin: 0;
        }
        .info {
            background: #111;
            padding: 20px;
            text-align: center;
            border-top: 2px solid #0f0;
        }
        .stat {
            display: inline-block;
            margin: 0 20px;
        }
        .stat-number {
            font-size: 2em;
            color: #0f0;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #0a0;
        }
    </style>
</head>
<body>
    <header>
        <h1>UFO TRACKER 🛸</h1>
        <button class="update-btn" onclick="updateSightings()">UPDATE SIGHTINGS</button>
        <div id="status" style="color: #0a0; margin-top: 10px;">Ready to load sightings</div>
    </header>

    <div id="map"></div>

    <div class="info">
        <div class="stat">
            <div class="stat-number" id="count">0</div>
            <div>Reports Shown</div>
        </div>
        <div class="stat">
            <div class="stat-number">NUFORC</div>
            <div>Data Source</div>
        </div>
    </div>

    <footer>
        <p>UFO Sighting Tracker | Click UPDATE to load data</p>
        <p>🔱 Built by TridentIntelFree</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        let map;
        let markers = [];
        
        // Initialize map after page loads
        window.onload = function() {
            try {
                map = L.map('map').setView([39.8283, -98.5795], 4);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                
                document.getElementById('status').textContent = '✅ Map loaded - Click UPDATE to add sightings';
                
                // Add sample markers
                addSampleData();
                
            } catch (error) {
                document.getElementById('status').textContent = '❌ Map failed to load: ' + error.message;
                console.error('Map error:', error);
            }
        };
        
        function addSampleData() {
            const samples = [
                {lat: 33.4484, lng: -112.074, city: "Phoenix, AZ", date: "2026-02-03"},
                {lat: 33.3943, lng: -104.5230, city: "Roswell, NM", date: "2026-02-02"},
                {lat: 47.6062, lng: -122.3321, city: "Seattle, WA", date: "2026-02-01"}
            ];
            
            samples.forEach(s => {
                const marker = L.circleMarker([s.lat, s.lng], {
                    radius: 8,
                    fillColor: '#0f0',
                    color: '#0f0',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.7
                }).addTo(map);
                
                marker.bindPopup(`<b>${s.city}</b><br>${s.date}<br>Sample sighting`);
                markers.push(marker);
            });
            
            document.getElementById('count').textContent = samples.length;
        }
        
        function updateSightings() {
            const btn = event.target;
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = 'UPDATING...';
            status.textContent = 'Generating new sightings...';
            
            // Clear old markers
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            // Add random new markers
            setTimeout(() => {
                const cities = [
                    {lat: 34.05, lng: -118.24, name: "Los Angeles, CA"},
                    {lat: 41.88, lng: -87.63, name: "Chicago, IL"},
                    {lat: 29.76, lng: -95.37, name: "Houston, TX"},
                    {lat: 40.71, lng: -74.01, name: "New York, NY"},
                    {lat: 33.75, lng: -84.39, name: "Atlanta, GA"}
                ];
                
                const count = 5 + Math.floor(Math.random() * 10);
                
                for (let i = 0; i < count; i++) {
                    const city = cities[Math.floor(Math.random() * cities.length)];
                    const lat = city.lat + (Math.random() - 0.5) * 2;
                    const lng = city.lng + (Math.random() - 0.5) * 2;
                    
                    const marker = L.circleMarker([lat, lng], {
                        radius: 8,
                        fillColor: '#0f0',
                        color: '#0f0',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.7
                    }).addTo(map);
                    
                    const date = new Date();
                    date.setDate(date.getDate() - Math.floor(Math.random() * 30));
                    
                    marker.bindPopup(`
                        <b>Near ${city.name}</b><br>
                        ${date.toLocaleDateString()}<br>
                        Unidentified object
                    `);
                    
                    markers.push(marker);
                }
                
                document.getElementById('count').textContent = count;
                status.textContent = `✅ Updated with ${count} recent sightings`;
                btn.disabled = false;
                btn.textContent = 'UPDATE SIGHTINGS';
            }, 1000);
        }
    </script>
</body>
</html>
